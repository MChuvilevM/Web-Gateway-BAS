name: BAS-Build-Validation

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint XML Structure
        run: |
          # Проверка целостности XML-проекта BAS
          xmllint --noout project.xml
      - name: Archive Project
        run: |
          # Создание готового к деплою архива проекта
          zip -r Web-Gateway-BAS.zip . -x "*.git*"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-package
          path: Web-Gateway-BAS.zip
